<style>

html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Fredoka',system-ui,sans-serif;padding-bottom:84px}
main{max-width:640px;margin:0 auto;padding:16px}
.hero{background:linear-gradient(150deg,#0e9aa7,#7b5cff);color:#fff;border-radius:24px;padding:20px;position:relative;overflow:hidden}

h2{font-size:19px;margin:22px 0 10px}

.task .t{flex:1;font-weight:500}.st{color:var(--stx);font-weight:700}
.subs{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sub{box-shadow:inset 7px 0 0 var(--c,transparent);font:inherit;color:inherit;background:var(--card);border:1.5px solid var(--line);border-radius:18px;padding:14px;text-align:left;cursor:pointer}
.sub .e{font-size:30px;display:block}.sub small{color:var(--mute)}.sub.done{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 12%,var(--card))}

.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:8px 0}

.chart{display:flex;align-items:flex-end;gap:4px;height:120px;overflow-x:auto;padding-bottom:2px}
.chart div{flex:1;min-width:18px;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;font-size:10px;color:var(--mute)}
.chart i{width:100%;border-radius:5px 5px 0 0;background:var(--pri)}.chart i.b{background:var(--star);border-radius:5px 5px 0 0}
.tbl{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:14px}td,th{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left}
.modal{position:fixed;inset:0;background:rgba(10,12,40,.7);display:none;place-items:center;padding:16px;z-index:9}.modal.on{display:grid}
.pz{background:var(--card);border-radius:24px;padding:22px;max-width:440px;width:100%;text-align:center}
.pz .q{font-size:26px;font-weight:700;margin:14px 0}.opts{display:grid;gap:10px}
.opts button{font:inherit;font-size:22px;font-weight:600;padding:14px;border-radius:14px;border:2px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer}
.opts button.ok{background:var(--ok);color:#fff}.opts button.no{background:var(--bad);color:#fff}
.mute{color:var(--mute);font-size:14px}

.cd{font:inherit;color:inherit;background:var(--card);border:1.5px solid var(--line);border-radius:10px;padding:6px 0;cursor:pointer;min-height:48px}
.cd small{display:block;color:var(--mute);font-size:11px}.cd.hit{background:var(--star);border-color:var(--star);color:#3a2a00}.cd.hit small{color:#3a2a00}.cd.sel{outline:3px solid var(--pri)}

@media(prefers-reduced-motion:reduce){*{transition:none!important}}

h2{font-size:19px;margin-top:26px}.card,.task,.sub{box-shadow:0 4px 12px #45301d04}.task{padding:16px}.sub{padding:18px;position:relative}.sub:hover,.task:hover:not(:disabled){border-color:var(--pri)}.sub small{display:block;margin-top:6px}.subs{gap:12px}.section-head{display:flex;align-items:center;justify-content:space-between}.section-head small{color:var(--mute);font-size:12px}

function orderedTasks(){const rank=t=>{t=String(t).toLowerCase();if(/wake|make.*bed|brush|teeth/.test(t))return 0;if(/breakfast/.test(t))return 1;if(/sock|ready|school bag/.test(t))return 2;if(/lunch/.test(t))return 3;if(/homework|writing|study/.test(t))return 4;if(/outdoor|play/.test(t)&&!/toy/.test(t))return 5;if(/tidy|toy|clean/.test(t))return 6;if(/read|book/.test(t))return 7;if(/dinner/.test(t))return 8;if(/bath|sleep|bedtime/.test(t))return 9;return 5};return S.tasks.map((task,index)=>({task,index})).sort((a,b)=>rank(a.task.t)-rank(b.task.t)||a.index-b.index).map(x=>x.task)}

function makeQs(sub){
 const planned=planFor(today()).find(p=>p.subject===sub),topic=(planned?.topic||'').toLowerCase();
 if(sub==='Maths')return [0,1,2].map((_,i)=>{
 const a=rnd(1,9),b=i===1?a:rnd(1,9),n=a+b;
 if(topic.includes('subtract')&&(i===1||!topic.includes('addition')))return question(`${n} − ${a} = ?`,b,[b+1,Math.max(0,b-1)],'Take away, then count what is left.',`${n} take away ${a} leaves ${b}.`);
 if(i===2&&(!planned||topic.includes('pattern')))return question('🍂 🎃 🍂 🎃 🍂 __','🎃',['🍂','🌻'],'What comes next in this repeating pattern?','A leaf and a pumpkin repeat in the same order.');
 return question(i===0?`There are ${a} pumpkins. You find ${b} more. How many altogether?`:`${a} + ${b} = ?`,n,[n+1,Math.max(0,n-1)],i===1?'A double has two equal numbers.':'Some, some more means add.',`${a} + ${b} = ${n}.`)
 });
 const group=S.readingGroup||'Spring';
 if(sub==='Phonics')return shuf([
 question('Which word begins with th?','thin',['pin','sun'],'Listen to the beginning sound.','Thin begins with the two-letter sound th.'),
 question('Add -ing to jump. What do you get?','jumping',['jumpth','jumpck'],'Choose the action word.','Jump + ing makes jumping.'),
 question('Finish the word: du__ 🦆','ck',['k','th'],'Which ending spells duck?','Duck has ck after its short vowel sound.'),
 question('Which word ends with k?','milk',['duck','cat'],'Look at the last letter.','Milk ends with the letter k.'),
 question('Which word has the ee sound?','need',['bed','get'],'Listen for the long e sound.','Need has ee, which says long e.'),
 question('Which word contains oa?','boat',['cat','shoe'],'Two letters, one long o sound.','Boat contains the vowel team oa.'),
 question('Which word contains oe?','toe',['boat','bed'],'Look carefully at the letters.','Toe has oe at the end.')
 ]).slice(0,3);
 if(sub==='English'){
 const words=planned?.words?.length?planned.words:(group==='Summer'?SUMMER:SPRING);
 const w=shuf(words.filter(x=>x.length>1)).slice(0,2);
 return w.map(word=>{let mixed=shuf(word.split('')).join('');if(mixed===word)mixed=word.slice(1)+word[0];return question(mixed,word,shuf([...SPRING,...SUMMER].filter(x=>x!==word)).slice(0,2),'Put the letters in order.',`The word is ${word}. Read it out loud.`)}).concat(question('Which word completes: You are my ___.','friend',['from','into'],'Read the whole sentence.','You are my friend.'));
 }
 if(sub==='Science'){
 const needs=[question('What does a plant need to grow?','Water',['Candy','Toys'],'Think about a living plant.','Plants need water, air and light to grow.'),question('Which helps a plant make its food?','Sunlight',['A blanket','A pencil'],'Think about light.','Plants use light to make their food.'),question('What do animals need to live?','Food, water and air',['Only toys','Only candy'],'What keeps a living animal healthy?','Animals need food, water, air and a suitable place to live.'),question('Which part takes in water from the soil?','Roots',['Flowers','Fruit'],'Look below the plant.','Roots absorb water from the soil.')];
 const force=[question('You move a toy car away from you. Is this a push or pull?','Push',['Pull','Neither'],'Think about the direction.','A push moves something away from you.'),question('You bring a wagon toward you with its handle. What do you use?','Pull',['Push','Neither'],'Toward you or away?','A pull brings something toward you.'),question('What brings a dropped ball toward the ground?','Gravity',['Sunlight','Sound'],'Think about falling objects.','Gravity pulls objects toward Earth.')];
 return shuf(topic.includes('push')||topic.includes('force')?force:needs).slice(0,3)
 }
 return shuf(topic.includes('continent')?[
 question('Which continent is India in?','Asia',['Africa','Europe'],'Think about the world map.','India is in Asia.'),question('Which continent do we live in, in California?','North America',['Asia','Antarctica'],'Where is the United States?','The United States is in North America.'),question('Which continent is covered by lots of ice?','Antarctica',['Africa','Europe'],'Think about the South Pole.','Antarctica is the continent around the South Pole.')
 ]:[question('Are all Native American nations the same?','No, each has its own traditions',['Yes, all are the same','They have no traditions'],'People and communities are diverse.','Native American nations have distinct languages, histories and traditions.'),question('Are Native American communities part of life today?','Yes',['No','Only in stories'],'Think about people living today.','Native American people and communities are part of life today.'),question('How can we learn respectfully about a culture?','Listen to people from that community',['Say everyone is the same','Make fun of traditions'],'Choose a kind and respectful action.','Listening to people from a community helps us learn about their experiences.')]).slice(0,3);
}

function voiceAvailable(){return typeof speechSynthesis!=='undefined'&&typeof SpeechSynthesisUtterance!=='undefined'}
function spokenText(text){const symbols={'🍂':'leaf','🎃':'pumpkin','🌻':'sunflower','🦆':'duck','+':' plus ','−':' minus ','=':' equals ','__':' blank ','_':' blank '};let s=String(text);for(const [from,to] of Object.entries(symbols))s=s.split(from).join(' '+to+' ');return s.replace(/[\p{Extended_Pictographic}\uFE0F]/gu,'').replace(/\s+/g,' ').trim()}
let activeSpeech=null,speechToken=0;
function voiceStatus(message){for(const id of ['voiceStatus','voiceLive']){const node=document.getElementById(id);if(node)node.textContent=message}}
function stopVoice(){speechToken++;if(voiceAvailable())speechSynthesis.cancel();activeSpeech=null}
function speak(text,manual=false){
 if(!voiceAvailable()){voiceStatus('Voice is unavailable here. Open the published app in Safari, Chrome or Edge.');return}
 if(!manual&&S.voiceEnabled===false)return;
 stopVoice();const token=speechToken,u=new SpeechSynthesisUtterance(spokenText(text));activeSpeech=u;
 u.lang='en-US';u.rate=Number(S.voiceRate)||0.85;u.pitch=1;u.volume=1;
 const voices=speechSynthesis.getVoices(),chosen=voices.find(v=>v.voiceURI===S.voiceURI)||voices.find(v=>/^en-US/i.test(v.lang)&&v.localService)||voices.find(v=>/^en/i.test(v.lang)&&v.localService)||voices.find(v=>/^en/i.test(v.lang));if(chosen){u.voice=chosen;u.lang=chosen.lang}
 u.onstart=()=>{if(token===speechToken)voiceStatus('🔊 Reading aloud…')};
 u.onend=()=>{if(token===speechToken){activeSpeech=null;voiceStatus('Ready. Tap Read aloud whenever you need help.')}};
 u.onerror=e=>{if(token!==speechToken||['canceled','interrupted'].includes(e.error))return;activeSpeech=null;voiceStatus(e.error==='not-allowed'?'Tap Start voice to allow spoken instructions.':'Voice could not play. Try Test voice in Parent, choose a different voice, and check your device volume.')};
 try{speechSynthesis.resume();speechSynthesis.speak(u)}catch(e){voiceStatus('Voice could not start. Open the published app in your browser and tap Start voice.')}
}

function stashPaste(){S.pasteDraft={text:document.getElementById('lessonText').value,start:document.getElementById('lessonStart').value,end:document.getElementById('lessonEnd').value,weekdays:document.getElementById('lessonWeekdays').checked,group:document.getElementById('lessonGroup').value};pasteDraft=null;document.getElementById('pasteReview').innerHTML='';try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}}
function parseLessonText(text,group){
 const sections={};let current=null;
 const headings=[['phonics','Phonics'],['math(?:ematics|s)?','Maths'],['science','Science'],['social studies','Social Studies'],['english|ela|reading','English'],['spelling','Spelling'],['summer group','Summer'],['spring group','Spring'],['sight words','Sight'],['decodable reader','Reader'],['public speaking(?:.*)|october poem(?:.*)','Speaking'],['important upcoming events|upcoming events|coming up(?:.*)|a friendly reminder(?:.*)|thank you(?:.*)|warm regards(?:.*)','Stop']];
 for(const raw of String(text).split(/\r?\n/)){const line=raw.trim().replace(/^[•*#\-]+\s*/, '').trim();if(!line)continue;let found=false;
 for(const [pattern,key] of headings){const re=new RegExp('^(?:'+pattern+')(?:\\s*:\\s*(.*)|\\s*)$','i'),m=line.match(re);if(m){current=key;sections[key]??=[];if(m[1])sections[key].push(m[1]);found=true;break}}
 if(!found&&current&&current!=='Stop')sections[current].push(line);
 }
 const tidy=lines=>(lines||[]).filter(x=>!/^let[’']?s|^we (?:will|are)|^students will|^please |^remember |^these (?:groups|words)|^keep practicing|^our (?:goal|focus)|^the goal|^because school|^thursday,|^words of the week\s*:?$/i.test(x));
 const wordList=lines=>[...new Set((lines||[]).flatMap(x=>{const clean=x.replace(/^words of the week\s*:\s*/i,'');return /,/.test(clean)&&/^[a-zA-Z\s,;'-]+$/.test(clean)?clean.split(/[,;]/).map(w=>w.trim().toLowerCase()).filter(w=>/^[a-z]+(?:['-][a-z]+)?$/.test(w)):[]}))];
 const result=[];for(const sub of SUBJ){let lines=tidy(sections[sub]),words=wordList(sections[sub]);
 if(sub==='English'){const chosen=sections[group]||sections.Spelling||[];lines=lines.concat(tidy(chosen),tidy(sections.Sight),tidy(sections.Reader),tidy(sections.Speaking));words=[...new Set([...words,...wordList(chosen),...wordList(sections.Sight)])]}
 if(!lines.length&&!words.length)continue;
 const content=lines.filter(x=>!wordList([x]).length).join(' · '),topic=content||`${sub==='English'?group+' spelling and sight words':sub+' practice'}`;
 result.push({subject:sub,topic:topic.slice(0,1200),keywords:words.join(', ')})
 }return result;
}
function lessonDates(start,end,weekdays){const a=new Date(start+'T12:00:00'),b=new Date(end+'T12:00:00');if(!/^\d{4}-\d{2}-\d{2}$/.test(start)||!/^\d{4}-\d{2}-\d{2}$/.test(end)||isNaN(a)||isNaN(b)||iso(a)!==start||iso(b)!==end||a>b||(b-a)/864e5>62)throw Error('Choose a valid date range of up to 63 days.');const dates=[];for(let d=new Date(a);d<=b;d.setDate(d.getDate()+1)){if(!weekdays||(d.getDay()!==0&&d.getDay()!==6))dates.push(iso(d))}if(!dates.length)throw Error('There are no weekdays in this range.');return dates}
function convertPaste(){stashPaste();try{const d=S.pasteDraft;if(!d.text.trim())throw Error('Paste the school lesson plan first.');const lessons=parseLessonText(d.text,d.group);if(!lessons.length)throw Error('No subject headings found. Add headings such as Phonics:, Math:, Science:, or Social Studies: before the notes.');pasteDraft={lessons,dates:lessonDates(d.start,d.end,d.weekdays),source:d.text};document.getElementById('pasteReview').innerHTML=pasteReviewUI()}catch(e){document.getElementById('pasteReview').innerHTML=`<p role="alert">${esc(e.message)}</p>`}}
function pasteReviewUI(){return `<b>Review ${pasteDraft.lessons.length} subjects · ${pasteDraft.dates.length} days</b><p class="mute">Edit topics and comma-separated keywords below. Remove a subject to leave its existing lessons alone. New puzzle types need a supported question pack.</p>${pasteDraft.lessons.map((r,i)=>`<div class="card"><div class="row"><b>${esc(r.subject)}</b><button class="btn alt" onclick="pasteDraft.lessons.splice(${i},1);document.getElementById('pasteReview').innerHTML=pasteReviewUI()">Remove</button></div><label>Topic <textarea rows="3" style="width:100%;font:inherit;padding:8px" oninput="pasteDraft.lessons[${i}].topic=this.value">${esc(r.topic)}</textarea></label><label>Keywords <input style="width:100%" value="${esc(r.keywords)}" oninput="pasteDraft.lessons[${i}].keywords=this.value"></label></div>`).join('')}<div class="row"><button class="btn" onclick="savePastedPlan()">Save to app</button><button class="btn alt" onclick="exportPastedPlan()">Download Excel plan</button><button class="btn alt" onclick="exportPastedCSV()">Download CSV</button></div><div id="pasteStatus" role="status" class="mute"></div>`}

function normSub(s){s=String(s||'').toLowerCase();return s.includes('phon')?'Phonics':s.includes('eng')?'English':s.includes('math')?'Maths':s.includes('sci')?'Science':s.includes('soc')?'Social Studies':null}
function normDate(v){if(v instanceof Date)return iso(v);const m=String(v).match(/(\d{4})-(\d{2})-(\d{2})/);if(m)return m[0];const d=new Date(v);return isNaN(d)?null:iso(d)}
function addRows(rows){const out=[];
 rows.forEach(o=>{const g={};Object.keys(o).forEach(k=>g[k.trim().toLowerCase()]=o[k]);
  const date=normDate(g.date),subject=normSub(g.subject);if(!date||!subject)return;
  out.push({date,subject,topic:String(g.topic||''),words:String(g.keywords||'').split(/[,;]/).map(x=>x.trim().toLowerCase()).filter(Boolean)})});
 if(!out.length){alert('No valid rows found. Check the column names: Date, Subject, Topic, Keywords.');return}
 S.plan=S.plan.filter(p=>!out.some(n=>n.date===p.date&&n.subject===p.subject)).concat(out);save();render()}

function growingIsland(){const total=all(),next=GROW_ITEMS.find(x=>total<x.stars),earned=GROW_ITEMS.filter(x=>total>=x.stars),previous=earned.at(-1)?.stars||0,pct=next?Math.min(100,(total-previous)/(next.stars-previous)*100):100;return `<section class="growing-island"><div class="section-head"><h2>Rishi’s Little Island</h2><span class="island-badge">${Object.keys(S.islandBuild||{}).length} items placed</span></div><p class="mute">Your own island canvas. Choose what to build and where it belongs.</p><svg class="build-canvas" onclick="placeBuild(event)" viewBox="0 0 620 425" role="img" aria-labelledby="growTitle growDesc"><title id="growTitle">Rishi’s growing island</title><desc id="growDesc">${total} stars earned. ${earned.length?earned.map(x=>x.name).join(', ')+' unlocked.':'A quiet empty island is waiting for its first palm tree.'} ${next?next.stars-total+' stars until '+next.name:'Your lighthouse is shining!'}</desc><defs><linearGradient id="growSea" x2="0" y2="1"><stop stop-color="#d5eeeb"/><stop offset="1" stop-color="#99cece"/></linearGradient><radialGradient id="growLand"><stop stop-color="#e4edc9"/><stop offset="1" stop-color="#c1d49e"/></radialGradient></defs><rect width="620" height="425" rx="14" fill="url(#growSea)"/><circle cx="80" cy="65" r="31" fill="#f5d78d"/><g fill="#fffaf0" opacity=".7"><ellipse cx="270" cy="50" rx="60" ry="14"/><ellipse cx="492" cy="69" rx="47" ry="12"/></g><ellipse cx="310" cy="305" rx="266" ry="79" fill="#7eb9bb" opacity=".3"/><path d="M55 270Q62 195 153 175Q176 110 267 145Q332 101 398 156Q505 144 542 218Q589 239 559 300Q510 363 387 368Q263 405 149 351Q60 329 55 270Z" fill="#f4ddb0" stroke="#fff0cd" stroke-width="8"/><path d="M80 261Q85 214 164 197Q183 137 265 163Q334 127 392 176Q488 164 518 224Q562 248 533 292Q475 339 378 342Q263 373 158 325Q86 310 80 261Z" fill="url(#growLand)"/><path d="M365 160Q315 217 339 255Q370 280 313 351" fill="none" stroke="#96c5c4" stroke-width="17" stroke-linecap="round"/><g fill="none" stroke="#ffffff80" stroke-width="3" stroke-linecap="round"><path d="M18 350q16-9 32 0t32 0M493 393q16-9 32 0t32 0"/></g><text x="548" y="128" font-size="30">🐢</text>${GROW_ITEMS.filter(item=>S.islandBuild?.[item.id]).map(item=>{const point=S.islandBuild[item.id];return `<g transform="translate(${point.x},${point.y})">${item.id==='light'?'<path d="M0-30L-55-48L-55-8Z" fill="#ffe89b" opacity=".6"/>':''}<ellipse cy="13" rx="23" ry="6" fill="#67835b" opacity=".18"/><text text-anchor="middle" y="10" font-size="44">${item.icon}</text></g>`}).join('')}${selectedBuild?'<text x="310" y="110" text-anchor="middle" font-size="15" fill="#3f6757">Tap the green island to place your item</text>':''}</svg>${buildingShelf()}<p class="mute" style="font-size:12px">You can move your items anytime. Reward purchases and missed days keep your island intact.</p></section>`}

function islandPosition(stars){let i=0;while(i<ISLAND_STOPS.length-1&&stars>=ISLAND_STOPS[i+1].stars)i++;const a=ISLAND_STOPS[i],b=ISLAND_STOPS[Math.min(i+1,ISLAND_STOPS.length-1)],f=a===b?0:Math.max(0,Math.min(1,(stars-a.stars)/(b.stars-a.stars)));return {x:a.x+(b.x-a.x)*f,y:a.y+(b.y-a.y)*f,index:i,next:a===b?null:b}}
function treasureMap(){const stars=all(),pos=islandPosition(stars),stop=ISLAND_STOPS[pos.index],route=ISLAND_STOPS.map(p=>`${p.x},${p.y}`).join(' '),visited=ISLAND_STOPS.slice(0,pos.index+1).map(p=>`${p.x},${p.y}`).concat(`${pos.x},${pos.y}`).join(' ');return `<section class="island-card" aria-label="Hawaii adventure journey"><div class="section-head"><h2>A journey through Hawaiʻi</h2><span class="island-badge">${stars} stars ⭐</span></div><p class="mute" style="margin-top:0">From sunny Kona to rainy Hilo—let’s visit your island memories again! One little star, one step along the story.</p><svg class="island-map" viewBox="0 0 600 620" role="img" aria-labelledby="islandTitle islandDesc"><title id="islandTitle">${esc(S.name)}’s Big Island adventure</title><desc id="islandDesc">An illustrated map of Hawaiʻi Island with Kona on the west and Hilo on the east. ${stars} lifetime stars. Last reached ${stop.name}. ${pos.next?pos.next.stars-stars+' stars to '+pos.next.name:'All eight places discovered.'} The trail is a game route, not a road map.</desc><defs><linearGradient id="sea" x2="0" y2="1"><stop stop-color="#bceef1"/><stop offset="1" stop-color="#60bdcf"/></linearGradient><linearGradient id="land" x2="1" y2="1"><stop stop-color="#edeac0"/><stop offset=".5" stop-color="#b5d78d"/><stop offset="1" stop-color="#6fb795"/></linearGradient></defs><rect width="600" height="620" rx="24" fill="url(#sea)"/><g fill="none" stroke="#ffffff80" stroke-width="3" stroke-linecap="round"><path d="M25 150q18-12 36 0t36 0M505 260q18-12 36 0t36 0M25 470q18-12 36 0t36 0M365 575q18-12 36 0t36 0"/></g><path d="M188 64 Q225 102 295 114 Q357 120 401 174 Q437 210 462 250 Q512 291 496 340 Q482 388 460 428 Q428 469 368 502 Q334 532 294 555 Q260 576 237 544 Q217 508 184 484 Q151 463 129 416 Q100 368 104 320 Q109 273 123 231 Q126 189 155 149 Q172 115 188 64Z" fill="#f8dda3" stroke="#f9e9bd" stroke-width="13"/><path d="M188 77 Q228 112 295 125 Q353 133 392 181 Q424 215 453 260 Q498 299 484 337 Q470 383 450 420 Q420 458 361 491 Q325 521 290 543 Q267 561 247 535 Q222 497 192 474 Q164 451 140 408 Q112 364 116 321 Q119 281 134 232 Q139 191 165 153 Q181 116 188 77Z" fill="url(#land)"/><path d="M190 340L280 190L370 350Z" fill="#829b6a" opacity=".42"/><path d="M229 395L316 280L403 409Z" fill="#7e8e6b" opacity=".3"/><g font-size="26"><text x="276" y="232">⛰️</text><text x="280" y="363">🌿</text><text x="183" y="434">🌴</text><text x="508" y="443">🐬</text><text x="44" y="351">⛵</text><text x="381" y="174">🌧️</text><text x="65" y="157">☀️</text></g><text x="300" y="48" text-anchor="middle" font-size="20" font-weight="700" fill="#245d63">HAWAIʻI · THE BIG ISLAND</text><g fill="#20545e" font-size="12" font-weight="700"><text x="45" y="390">KONA COAST</text><text x="475" y="320">HILO</text><text x="275" y="594">PACIFIC OCEAN</text></g><g transform="translate(540 78)" fill="#245d63"><text y="-16" text-anchor="middle" font-size="12" font-weight="700">N</text><path d="M0-9L-7 9L0 5L7 9Z"/></g><polyline points="${route}" fill="none" stroke="#fbf2d6" stroke-width="9" stroke-linejoin="round" stroke-dasharray="2 12" stroke-linecap="round"/><polyline points="${visited}" fill="none" stroke="#ce7d35" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"/>${ISLAND_STOPS.map((p,i)=>`<g><circle cx="${p.x}" cy="${p.y}" r="22" fill="${stars>=p.stars?'#fff4c8':'#ecf0e4'}" stroke="${stars>=p.stars?'#a36a2e':'#74957b'}" stroke-width="2.5"/><text x="${p.x}" y="${p.y+8}" text-anchor="middle" font-size="24" ${stars<p.stars?'opacity=".5"':''}>${p.icon}</text><circle cx="${p.x+17}" cy="${p.y-17}" r="9" fill="#325c4a"/><text x="${p.x+17}" y="${p.y-13}" text-anchor="middle" font-size="10" font-weight="700" fill="#fff">${i+1}</text></g>`).join('')}<g transform="translate(${pos.x},${pos.y-36})"><circle r="15" fill="#9c4233" stroke="#fff" stroke-width="3"/><text y="5" text-anchor="middle" font-size="16">⭐</text><path d="M-5 12L0 20L5 12" fill="#9c4233"/></g></svg><div class="island-status" role="status"><b>${pos.next?'Next stop: '+pos.next.icon+' '+pos.next.name:'🌈 Rainbow Falls reached!'}</b><span>${pos.next?`${pos.next.stars-stars} more stars to arrive · ${stars} / ${pos.next.stars}`:'You explored every stop! Keep learning and collecting stars.'}</span></div><div class="hawaii-stops">${ISLAND_STOPS.map((p,i)=>`<div class="hawaii-stop ${stars>=p.stars?'reached':''}"><span>${p.icon}</span><div><b>${i+1}. ${p.name}</b><small>${stars>=p.stars?'✓ Visited':'🔒 '+p.stars+' stars'}</small></div></div>`).join('')}</div><p class="mute" style="font-size:12px;margin-bottom:0">Illustrated island map; the dotted trail is a game journey. All earned stars move you forward, even when you spend stars on rewards.</p></section>`}
const bal=()=>all()-S.buys.reduce((a,b)=>a+b.c,0);
function rewardArt(text){const t=String(text).toLowerCase();if(/teaspoon/.test(t))return ['🧋','A favorite Teaspoon treat','#e5ead9'];if(/paris baguette/.test(t))return ['🥐','A bakery delight','#f5e4cb'];if(/lego/.test(t))return ['🧱','Build something wonderful','#e0e9f2'];if(/ice cream|sweet|dessert|treat/.test(t))return ['🍨','A little sweet delight','#f6e2d7'];if(/cartoon|movie|screen|tv/.test(t))return ['🎬','A cozy watching moment','#e4e6f2'];if(/dinner|meal|food|pizza/.test(t))return ['🍕','Something delicious','#f6ebce'];if(/book|read/.test(t))return ['📖','A new story awaits','#e2ebd9'];if(/park|trip|outdoor|play/.test(t))return ['🪁','An adventure together','#dfece8'];if(/toy|game/.test(t))return ['🧸','A little playtime magic','#eee1d4'];return ['🎁','A special little surprise','#ece5d4']}
function shop(){const b=bal();return `<section class="reward-book"><div class="reward-cover"><div><div class="reward-kicker">THE ISLAND TREASURE ROOM</div><h1>Little stars.<br>Lovely surprises.</h1><p>You have been learning and growing.<br>Choose a little joy with your saved stars.</p><div class="star-purse"><span>⭐</span><div><strong>${b}</strong><small>stars in your treasure pouch</small></div></div></div><svg viewBox="0 0 220 210" class="chest-art" role="img" aria-label="An illustrated treasure chest full of stars"><ellipse cx="110" cy="186" rx="85" ry="13" fill="#d5c2a3" opacity=".4"/><path d="M37 95Q38 52 73 42L154 40Q180 48 184 93Z" fill="#a8764e" stroke="#71543b" stroke-width="3"/><path d="M58 91Q58 56 78 54L147 53Q162 58 165 91" fill="#cfa776"/><path d="M35 97L186 97L180 171Q178 184 165 184L55 184Q40 183 39 171Z" fill="#bc8b58" stroke="#71543b" stroke-width="3"/><path d="M38 112H184M41 151H181" stroke="#966c47" stroke-width="3"/><path d="M65 99V181M157 99V181" stroke="#ebcb82" stroke-width="11"/><path d="M100 97H120V135Q110 145 100 135Z" fill="#edca78" stroke="#a88043" stroke-width="2"/><circle cx="110" cy="122" r="4" fill="#765b3b"/><g fill="#e7b85d" stroke="#c1954d" stroke-width="1"><path d="M110 13L115 25L128 26L118 35L121 48L110 41L99 48L102 35L92 26L105 25Z"/><path d="M45 27L49 37L60 38L51 45L54 56L45 50L36 56L38 45L30 38L41 37Z"/><path d="M172 14L175 23L185 24L178 30L180 40L172 35L165 40L166 30L159 24L169 23Z"/></g><g fill="#8da787"><circle cx="26" cy="78" r="3"/><circle cx="197" cy="68" r="4"/><circle cx="77" cy="15" r="3"/></g></svg></div><div class="section-head"><h2>Choose your next little joy</h2><small>${S.rewards.length} surprises</small></div><div class="reward-grid">${S.rewards.map(r=>{const [icon,caption,color]=rewardArt(r.t),ready=b>=r.c;return `<article class="reward-tile ${ready?'ready':'waiting'}"><div class="reward-illustration" style="--wash:${color}"><span role="img" aria-label="Reward illustration">${icon}</span><span class="reward-ticket">${r.c} ⭐</span></div><div class="reward-copy"><small>${caption}</small><h3>${esc(r.t)}</h3><p>${ready?'Your stars can unlock this surprise.':`${r.c-b} more stars to unlock this surprise.`}</p><button class="btn ${ready?'':'alt'}" ${ready?'':'disabled'} onclick="buy(${r.id})">${ready?'Choose this reward':'🔒 Keep collecting'}</button></div></article>`}).join('')||'<div class="card mute">Your treasure shelf is waiting. A parent can add rewards in the Parent Zone.</div>'}</div><div class="reward-note">🐢 One little step at a time. Spending stars keeps your Hawaiʻi journey progress.</div><h2>My happy memories</h2><div class="reward-memories">${S.buys.slice().reverse().slice(0,8).map(x=>`<div class="reward-memory"><span>${rewardArt(x.t)[0]}</span><div><b>${esc(x.t)}</b><small>${esc(x.date)} · ${x.c} stars</small></div><span class="memory-seal">✓</span></div>`).join('')||'<div class="reward-empty"><span>🌷</span><b>Your first surprise is waiting.</b><p>Complete an adventure, earn a star, and grow your little collection of happy moments.</p></div>'}</div></section>`}
function buy(id){const r=S.rewards.find(x=>x.id===id);if(!r||bal()<r.c)return;if(!confirm(`Spend ${r.c} stars on "${r.t}"?`))return;S.buys.push({date:today(),t:r.t,c:r.c});save();render()}

async function restore(input){try{const file=input.files[0];if(!file)return;const j=JSON.parse(await file.text()),x=j.state;if(j.app!=='RishiStarQuest'||!x||!Array.isArray(x.tasks)||!Array.isArray(x.plan)||!Array.isArray(x.rewards)||!Array.isArray(x.buys)||!x.days||typeof x.days!=='object'||Array.isArray(x.days)||!Number.isFinite(x.goal)||x.goal<1||!/^\d{4}$/.test(x.pin))throw Error();for(const d of Object.values(x.days)){if(!Array.isArray(d.done)||!d.bonus||typeof d.bonus!=='object'||d.done.some(t=>!Number.isFinite(t.s))||Object.values(d.bonus).some(v=>!Number.isFinite(v)))throw Error()}if(!confirm('Replace current progress with this backup? Export your current progress first if you need it.'))return;S=Object.assign(S,x);save();render();alert('Backup restored.')}catch(e){alert('This file is not a valid Star Quest backup.')}}
